[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeolus-rams-phase5"
version = "1.0.0"
description = "AEOLUS-RAMS Phase 5 — FTA: turbine overspeed catastrophic failure, MCS, importance measures, CCF analysis"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
diagrams = ["graphviz>=0.20"]
dev      = ["pytest>=7.0", "tabulate>=0.9"]

[project.scripts]
aeolus-rams-phase5 = "aeolus_rams_phase5.pipeline:main"

[tool.setuptools.packages.find]
include = ["aeolus_rams_phase5*"]

[tool.pytest.ini_options]
testpaths = ["tests"]