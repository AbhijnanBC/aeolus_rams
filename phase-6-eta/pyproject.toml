[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeolus-rams-phase6"
version = "1.0.0"
description = "AEOLUS-RAMS Phase 6 — ETA: consequence frequencies, risk matrix, bow-tie, ALARP argument"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "tabulate>=0.9"]

[project.scripts]
aeolus-rams-phase6 = "aeolus_rams_phase6.pipeline:main"

[tool.setuptools.packages.find]
include = ["aeolus_rams_phase6*"]

[tool.pytest.ini_options]
testpaths = ["tests"]